<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransDOC - Intelligent PDF Translation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9em;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
        }

        .language-selection {
            margin-bottom: 20px;
        }

        .language-selection label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .language-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            color: #333;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .translate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .translate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Progress Container Styles */
        .progress-container {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border-radius: 15px;
            border: 1px solid #e0e7ff;
        }

        .progress-container.active {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .progress-percentage {
            font-weight: 700;
            color: #667eea;
            font-size: 1.3em;
        }

        /* Main Progress Bar */
        .progress-bar-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e7ff;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Current Stage Display */
        .current-stage {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e0e7ff;
        }

        .current-stage-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .current-stage-name {
            font-size: 1.15em;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #e0e7ff;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Stage Progress */
        .stage-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .stage-progress-bar {
            flex: 1;
            height: 6px;
            background: #e0e7ff;
            border-radius: 3px;
            overflow: hidden;
        }

        .stage-progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.2s ease;
        }

        .stage-progress-text {
            font-size: 0.85em;
            color: #666;
            min-width: 80px;
            text-align: right;
        }

        /* Stages List */
        .stages-list {
            margin-top: 15px;
        }

        .stages-list-title {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stage-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #e0e7ff;
            transition: all 0.3s ease;
        }

        .stage-item.completed {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .stage-item.active {
            background: #fef3c7;
            border-color: #fcd34d;
            box-shadow: 0 2px 8px rgba(252, 211, 77, 0.3);
        }

        .stage-item.pending {
            opacity: 0.6;
        }

        .stage-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 0.9em;
        }

        .stage-item.completed .stage-icon {
            color: #10b981;
        }

        .stage-item.active .stage-icon {
            color: #f59e0b;
        }

        .stage-item.pending .stage-icon {
            color: #9ca3af;
        }

        .stage-name {
            flex: 1;
            font-size: 0.9em;
            color: #333;
        }

        .stage-status {
            font-size: 0.8em;
            color: #666;
        }

        .stage-item.completed .stage-status {
            color: #10b981;
        }

        .stage-item.active .stage-status {
            color: #f59e0b;
        }

        /* Part Info */
        .part-info {
            text-align: center;
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e7ff;
        }

        /* Result Container */
        .result-container {
            display: none;
            margin-top: 20px;
            padding: 25px;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-radius: 15px;
            border: 2px solid #86efac;
            text-align: center;
        }

        .result-container.active {
            display: block;
        }

        .result-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .result-text {
            color: #166534;
            font-weight: 600;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        /* Error Container */
        .error-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border-radius: 15px;
            border: 2px solid #fca5a5;
        }

        .error-container.active {
            display: block;
        }

        .error-icon {
            font-size: 2em;
            text-align: center;
            margin-bottom: 10px;
        }

        .error-text {
            color: #dc2626;
            text-align: center;
            font-weight: 500;
        }

        /* Cancel Button */
        .cancel-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 TransDOC</h1>
            <p>Intelligent PDF Translation with Layout Preservation</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Drop your PDF here or click to browse</div>
            <div class="upload-subtext">Supports PDF files up to 50MB</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="language-selection">
            <label>Translation Languages:</label>
            <div class="language-grid">
                <div>
                    <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 5px;">From:</label>
                    <select id="sourceLang">
                        <option value="en">English</option>
                        <option value="ar">Arabic</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 5px;">To:</label>
                    <select id="targetLang">
                        <option value="ar">Arabic</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="translate-btn" id="translateBtn" disabled>
            Translate Document
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <span class="progress-title">Translation Progress</span>
                <span class="progress-percentage" id="progressPercentage">0%</span>
            </div>
            
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="current-stage">
                <div class="current-stage-label">Current Step</div>
                <div class="current-stage-name">
                    <div class="stage-spinner" id="stageSpinner"></div>
                    <span id="currentStageName">Initializing...</span>
                </div>
                <div class="stage-progress">
                    <div class="stage-progress-bar">
                        <div class="stage-progress-fill" id="stageProgressFill"></div>
                    </div>
                    <span class="stage-progress-text" id="stageProgressText">0 / 0</span>
                </div>
            </div>

            <div class="stages-list" id="stagesList">
                <div class="stages-list-title">Processing Pipeline</div>
                <div id="stagesContainer"></div>
            </div>

            <div class="part-info" id="partInfo" style="display: none;">
                Processing part <span id="currentPart">1</span> of <span id="totalParts">1</span>
            </div>

            <button class="cancel-btn" id="cancelBtn">Cancel Translation</button>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-icon">✅</div>
            <div class="result-text">Translation completed successfully!</div>
            <button class="download-btn" id="downloadBtn">Download Translated PDF</button>
        </div>

        <div class="error-container" id="errorContainer">
            <div class="error-icon">❌</div>
            <div class="error-text" id="errorText"></div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = window.location.origin;

        let selectedFile = null;
        let currentSessionId = null;
        let eventSource = null;
        let completedStages = new Set();
        let allStages = [];

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const translateBtn = document.getElementById('translateBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercentage = document.getElementById('progressPercentage');
        const currentStageName = document.getElementById('currentStageName');
        const stageProgressFill = document.getElementById('stageProgressFill');
        const stageProgressText = document.getElementById('stageProgressText');
        const stagesContainer = document.getElementById('stagesContainer');
        const partInfo = document.getElementById('partInfo');
        const currentPart = document.getElementById('currentPart');
        const totalParts = document.getElementById('totalParts');
        const resultContainer = document.getElementById('resultContainer');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');
        const downloadBtn = document.getElementById('downloadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const stageSpinner = document.getElementById('stageSpinner');

        // Default stages (will be replaced by server data)
        const defaultStages = [
            { name: 'Create IL', display_name: '📄 Parsing PDF Structure' },
            { name: 'Detect Scanned File', display_name: '🔍 Detecting Scanned Content' },
            { name: 'Layout', display_name: '📐 Analyzing Page Layout' },
            { name: 'Table', display_name: '📊 Processing Tables' },
            { name: 'Paragraph', display_name: '📝 Finding Paragraphs' },
            { name: 'Styles And Formulas', display_name: '🔢 Processing Formulas & Styles' },
            { name: 'AutomaticTermExtractor', display_name: '📚 Extracting Terms' },
            { name: 'Translate', display_name: '🌐 Translating Content' },
            { name: 'Typesetting', display_name: '✍️ Typesetting Document' },
            { name: 'Font Mapper', display_name: '🔤 Mapping Fonts' },
            { name: 'PDF Creater', display_name: '📑 Generating PDF' },
            { name: 'Subset Font', display_name: '⚙️ Subsetting Fonts' },
            { name: 'Save PDF', display_name: '💾 Saving Document' },
        ];

        // Initialize stages
        function initializeStages(stages = null) {
            allStages = stages || defaultStages;
            completedStages.clear();
            stagesContainer.innerHTML = '';
            
            allStages.forEach(stage => {
                const stageEl = document.createElement('div');
                stageEl.className = 'stage-item pending';
                stageEl.id = `stage-${stage.name.replace(/\s+/g, '-')}`;
                stageEl.innerHTML = `
                    <div class="stage-icon">⏳</div>
                    <div class="stage-name">${stage.display_name}</div>
                    <div class="stage-status">Pending</div>
                `;
                stagesContainer.appendChild(stageEl);
            });
        }

        // Update stage status
        function updateStageStatus(stageName, status, displayName) {
            // Find stage element by partial match
            const stageEl = Array.from(stagesContainer.children).find(el => {
                const elName = el.querySelector('.stage-name').textContent;
                return elName.includes(stageName) || 
                       displayName && elName === displayName ||
                       el.id.toLowerCase().includes(stageName.toLowerCase().replace(/\s+/g, '-'));
            });
            
            if (!stageEl) return;

            stageEl.className = `stage-item ${status}`;
            const iconEl = stageEl.querySelector('.stage-icon');
            const statusEl = stageEl.querySelector('.stage-status');

            if (status === 'completed') {
                iconEl.textContent = '✅';
                statusEl.textContent = 'Complete';
                completedStages.add(stageName);
            } else if (status === 'active') {
                iconEl.textContent = '⚡';
                statusEl.textContent = 'Processing...';
            } else {
                iconEl.textContent = '⏳';
                statusEl.textContent = 'Pending';
            }
        }

        // Find and update stage by matching name
        function findAndUpdateStage(stageName, displayName, status) {
            const stageEls = stagesContainer.children;
            for (const stageEl of stageEls) {
                const nameEl = stageEl.querySelector('.stage-name');
                if (nameEl && (
                    nameEl.textContent === displayName ||
                    nameEl.textContent.includes(stageName) ||
                    stageName.toLowerCase().includes(nameEl.textContent.split(' ').pop()?.toLowerCase() || '')
                )) {
                    stageEl.className = `stage-item ${status}`;
                    const iconEl = stageEl.querySelector('.stage-icon');
                    const statusEl = stageEl.querySelector('.stage-status');

                    if (status === 'completed') {
                        iconEl.textContent = '✅';
                        statusEl.textContent = 'Complete';
                    } else if (status === 'active') {
                        iconEl.textContent = '⚡';
                        statusEl.textContent = 'Processing...';
                    }
                    break;
                }
            }
        }

        // Upload area event handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                showError('Please select a PDF file');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showError('File size must be less than 50MB');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('active');
            translateBtn.disabled = false;
            hideError();
            hideResult();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Translate button click
        translateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;

            if (sourceLang === targetLang) {
                showError('Source and target languages must be different');
                return;
            }

            await startTranslation(selectedFile, sourceLang, targetLang);
        });

        // Cancel button
        cancelBtn.addEventListener('click', () => {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            hideProgress();
            translateBtn.disabled = false;
            showError('Translation cancelled');
        });

        async function startTranslation(file, sourceLang, targetLang) {
            hideError();
            hideResult();
            showProgress();
            translateBtn.disabled = true;
            initializeStages();

            try {
                // Step 1: Start translation and get session ID
                const formData = new FormData();
                formData.append('file', file);
                formData.append('source_lang', sourceLang);
                formData.append('target_lang', targetLang);

                updateCurrentStage('📤 Uploading document...', 0, 0, 0);

                const startResponse = await fetch(`${API_BASE_URL}/translate/start`, {
                    method: 'POST',
                    body: formData
                });

                if (!startResponse.ok) {
                    const errorData = await startResponse.json();
                    throw new Error(errorData.detail || 'Failed to start translation');
                }

                const { session_id } = await startResponse.json();
                currentSessionId = session_id;

                // Step 2: Connect to progress stream
                connectToProgressStream(session_id);

            } catch (error) {
                console.error('Translation error:', error);
                showError(error.message || 'An error occurred during translation');
                hideProgress();
                translateBtn.disabled = false;
            }
        }

        function connectToProgressStream(sessionId) {
            eventSource = new EventSource(`${API_BASE_URL}/translate/progress/${sessionId}`);

            let currentActiveStage = null;

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    switch (data.type) {
                        case 'init':
                            updateCurrentStage('⏳ Initializing translation...', 0, 0, 0);
                            break;

                        case 'stage_summary':
                            // Reinitialize stages with server data
                            if (data.stages && data.stages.length > 0) {
                                initializeStages(data.stages);
                            }
                            break;

                        case 'progress_start':
                            // Mark previous stage as completed
                            if (currentActiveStage && currentActiveStage !== data.stage) {
                                findAndUpdateStage(currentActiveStage, '', 'completed');
                            }
                            currentActiveStage = data.stage;
                            
                            // Update current stage
                            findAndUpdateStage(data.stage, data.display_name, 'active');
                            updateCurrentStage(
                                data.display_name,
                                0,
                                data.stage_current,
                                data.stage_total
                            );
                            updateOverallProgress(data.overall_progress || 0);
                            updatePartInfo(data.part_index, data.total_parts);
                            break;

                        case 'progress_update':
                            currentActiveStage = data.stage;
                            findAndUpdateStage(data.stage, data.display_name, 'active');
                            updateCurrentStage(
                                data.display_name,
                                data.stage_progress,
                                data.stage_current,
                                data.stage_total
                            );
                            updateOverallProgress(data.overall_progress);
                            updatePartInfo(data.part_index, data.total_parts);
                            break;

                        case 'progress_end':
                            findAndUpdateStage(data.stage, data.display_name, 'completed');
                            updateOverallProgress(data.overall_progress);
                            break;

                        case 'finish':
                            // Mark all stages as completed
                            Array.from(stagesContainer.children).forEach(el => {
                                el.className = 'stage-item completed';
                                el.querySelector('.stage-icon').textContent = '✅';
                                el.querySelector('.stage-status').textContent = 'Complete';
                            });
                            
                            updateOverallProgress(100);
                            stageSpinner.style.display = 'none';
                            currentStageName.textContent = '✅ Translation Complete!';
                            
                            eventSource.close();
                            eventSource = null;
                            
                            setTimeout(() => {
                                hideProgress();
                                showResult();
                            }, 1000);
                            break;

                        case 'error':
                            eventSource.close();
                            eventSource = null;
                            hideProgress();
                            showError(data.error || 'An error occurred during translation');
                            translateBtn.disabled = false;
                            break;
                    }
                } catch (e) {
                    console.error('Error parsing progress event:', e);
                }
            };

            eventSource.onerror = (error) => {
                console.error('EventSource error:', error);
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                // Don't show error if translation completed
                if (!resultContainer.classList.contains('active')) {
                    hideProgress();
                    showError('Connection lost. Please try again.');
                    translateBtn.disabled = false;
                }
            };
        }

        function updateCurrentStage(name, progress, current, total) {
            currentStageName.textContent = name;
            stageProgressFill.style.width = `${progress}%`;
            
            if (total > 0) {
                stageProgressText.textContent = `${current} / ${total}`;
            } else {
                stageProgressText.textContent = progress > 0 ? `${Math.round(progress)}%` : 'Starting...';
            }
        }

        function updateOverallProgress(progress) {
            const roundedProgress = Math.round(progress);
            progressFill.style.width = `${roundedProgress}%`;
            progressPercentage.textContent = `${roundedProgress}%`;
        }

        function updatePartInfo(partIndex, totalPartsCount) {
            if (totalPartsCount > 1) {
                partInfo.style.display = 'block';
                currentPart.textContent = partIndex;
                totalParts.textContent = totalPartsCount;
            } else {
                partInfo.style.display = 'none';
            }
        }

        // Download button click
        downloadBtn.addEventListener('click', () => {
            if (!currentSessionId) return;
            
            // Open download URL in new tab/window
            window.open(`${API_BASE_URL}/translate/download/${currentSessionId}`, '_blank');
        });

        function showProgress() {
            progressContainer.classList.add('active');
            progressFill.style.width = '0%';
            progressPercentage.textContent = '0%';
            stageProgressFill.style.width = '0%';
            stageProgressText.textContent = 'Starting...';
            stageSpinner.style.display = 'block';
        }

        function hideProgress() {
            progressContainer.classList.remove('active');
        }

        function showResult() {
            resultContainer.classList.add('active');
            translateBtn.disabled = false;
        }

        function hideResult() {
            resultContainer.classList.remove('active');
        }

        function showError(message) {
            errorText.textContent = message;
            errorContainer.classList.add('active');
        }

        function hideError() {
            errorContainer.classList.remove('active');
        }
    </script>
</body>
</html>
